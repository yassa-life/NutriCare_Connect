spring:
  application:
    name: nutricare-connect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nutricare?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Colombo
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: always
nutricare:
  jwt-secret: ${JWT_SECRET:academic-demo-secret-change-before-deployment}
  jwt-hours: 8
  demo-notifications: true
  web-origin: ${WEB_ORIGIN:http://localhost:5173}

