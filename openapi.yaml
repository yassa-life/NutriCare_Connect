openapi: 3.0.3
info:
  title: NutriCare Connect API
  version: 1.0.0
  description: Local portfolio application API. Seed records are fictional, health thresholds are non-diagnostic, and payment gateways remain simulated. SMTP email can be enabled locally.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - { name: Access }
  - { name: Appointments }
  - { name: Health }
  - { name: Diet }
  - { name: Communication }
  - { name: Analytics }
paths:
  /auth/register:
    post:
      tags: [Access]
      security: []
      summary: Register a user
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: Account created }, '400': { $ref: '#/components/responses/BadRequest' } }
  /auth/login:
    post:
      tags: [Access]
      security: []
      summary: Authenticate and issue a JWT
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email,password], properties: { email: { type: string, format: email }, password: { type: string, format: password } } } } } }
      responses: { '200': { description: JWT and user view }, '400': { $ref: '#/components/responses/BadRequest' } }
  /auth/logout:
    post: { tags: [Access], summary: End the current session and record an audit event, responses: { '204': { description: Signed out } } }
  /auth/forgot-password:
    post:
      tags: [Access]
      security: []
      summary: Send a six-digit password reset code by email
      responses: { '200': { description: Generic delivery response; local simulation may include demoOtp } }
  /auth/reset-password:
    post:
      tags: [Access]
      security: []
      summary: Reset a password using a valid ten-minute code
      responses: { '204': { description: Password changed }, '400': { $ref: '#/components/responses/BadRequest' } }
  /auth/change-password:
    post:
      tags: [Access]
      summary: Replace a temporary or current password
      responses: { '200': { description: Updated user with mustChangePassword cleared } }
  /users/me:
    get: { tags: [Access], summary: Get the signed-in user's profile, responses: { '200': { description: Current profile } } }
    patch:
      tags: [Access]
      summary: Update changeable profile information
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileRequest' } } } }
      responses: { '200': { description: Updated profile } }
  /users:
    get: { tags: [Access], summary: List users (system administrator only), responses: { '200': { description: User views } } }
  /users/staff:
    post:
      tags: [Access]
      summary: Provision a staff account and return its one-time temporary password
      responses: { '201': { description: Staff user and one-time password }, '403': { description: System administrator role required } }
  /users/{id}/status:
    patch:
      tags: [Access]
      summary: Enable or disable an account without deleting linked records
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses: { '200': { description: Updated user } }
  /users/{id}/role:
    patch:
      tags: [Access]
      summary: Change an assigned role (system administrator only)
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      responses: { '200': { description: Updated user } }
  /users/{id}/unlock:
    post:
      tags: [Access]
      summary: Unlock an account
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      responses: { '200': { description: Updated user } }
  /schedules/slots:
    get:
      tags: [Appointments]
      summary: List slots for a date
      parameters: [ { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: Availability slots } }
  /appointments/hold:
    post:
      tags: [Appointments]
      summary: Hold a slot for ten minutes and create an invoice
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HoldRequest' } } } }
      responses: { '201': { description: Booking, slot and invoice }, '409': { description: Slot conflict } }
  /appointments/{id}/payments:
    post:
      tags: [Appointments]
      summary: Save a simulated payment result
      description: Card numbers and CVV fields are deliberately unsupported.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentRequest' } } } }
      responses: { '201': { description: Simulated payment record } }
  /appointments/{id}/cancel:
    post:
      tags: [Appointments]
      summary: Cancel and release a booking slot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Cancelled } }
  /appointments/patient/{id}:
    get:
      tags: [Appointments]
      summary: List patient appointments
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      responses: { '200': { description: Appointments } }
  /workspace/people:
    get:
      tags: [Access]
      summary: List enabled people available to the signed-in care role
      responses: { '200': { description: Database-backed account directory }, '403': { description: Care or administration role required } }
  /workspace/appointments:
    get:
      tags: [Appointments]
      summary: List appointments scoped to the signed-in account
      description: Patients see their own rows; doctors and dietitians see rows assigned to them; authorized operational roles see all rows.
      responses: { '200': { description: Scoped appointments joined with patient, practitioner and invoice details } }
  /workspace/slots:
    get:
      tags: [Appointments]
      summary: List database slots for a date, scoped to the signed-in practitioner when applicable
      parameters: [ { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: Scoped availability slots } }
  /checkups:
    post:
      tags: [Health]
      summary: Record a health check and create threshold alerts
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckRequest' } } } }
      responses: { '201': { description: Check, alerts and disclaimer } }
  /checkups/patient/{id}:
    get:
      tags: [Health]
      summary: Get patient health history
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      responses: { '200': { description: Health checks } }
  /health-alerts:
    get: { tags: [Health], summary: List open alerts, responses: { '200': { description: Alerts } } }
  /diet-plans:
    post:
      tags: [Diet]
      summary: Create a draft diet plan
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DietPlanRequest' } } } }
      responses: { '201': { description: Draft plan } }
  /diet-plans/{id}/publish:
    post:
      tags: [Diet]
      summary: Publish a plan
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Published plan } }
  /diet-plans/patient/{id}:
    get:
      tags: [Diet]
      summary: List patient plans
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      responses: { '200': { description: Plans } }
  /progress-logs:
    post:
      tags: [Diet]
      summary: Record meals, water, weight and BMI
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressRequest' } } } }
      responses: { '201': { description: Progress log } }
  /progress-logs/patient/{id}:
    get:
      tags: [Diet]
      summary: Return patient trend data
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      responses: { '200': { description: Progress logs } }
  /messages:
    post:
      tags: [Communication]
      summary: Send a non-urgent secure message
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageRequest' } } } }
      responses: { '201': { description: Message } }
  /messages/patient/{id}:
    get:
      tags: [Communication]
      summary: Get patient-care conversation
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      responses: { '200': { description: Messages } }
  /notifications:
    post:
      tags: [Communication]
      summary: Create an in-app or simulated external notification
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationRequest' } } } }
      responses: { '201': { description: Notification delivery record } }
  /notifications/recipient/{id}:
    get:
      tags: [Communication]
      summary: Get recipient notifications
      parameters: [ { $ref: '#/components/parameters/AccountId' } ]
      responses: { '200': { description: Notifications } }
  /assistant/guide:
    post:
      tags: [Health]
      summary: Provide temporary AI care support and site guidance for a patient
      description: Patient-only Module 03 health Q&A using Gemini 3.5 Flash-Lite when configured. Answers include a professional-care reminder. Deterministic emergency screening runs before the AI call; emergencies direct the patient to Sri Lanka's 1990 ambulance service. The assistant cannot diagnose, prescribe, replace a clinician, or confirm that staff are monitoring the chat.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [question], properties: { question: { type: string, maxLength: 500 }, history: { type: array, maxItems: 6, items: { type: object, properties: { from: { type: string }, text: { type: string } } } } } } } } }
      responses: { '200': { description: Answer, urgency level, emergency number, suggested destinations and GEMINI or LOCAL source }, '403': { description: Patient role required } }
  /feedback:
    post:
      tags: [Analytics]
      summary: Save rating and automatically escalate low scores
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackRequest' } } } }
      responses: { '201': { description: Feedback and optional complaint } }
  /feedback/patient/{id}:
    get:
      tags: [Analytics]
      summary: List feedback submitted by a patient
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses: { '200': { description: Patient feedback entries } }
  /feedback/{id}:
    put:
      tags: [Analytics]
      summary: Update own feedback rating and comments
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackUpdateRequest' } } } }
      responses: { '200': { description: Updated feedback and optional complaint } }
    delete:
      tags: [Analytics]
      summary: Delete own feedback and linked complaint
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '204': { description: Feedback removed } }
  /complaints:
    get: { tags: [Analytics], summary: List complaint tickets, responses: { '200': { description: Complaints } } }
  /reports/summary:
    get:
      tags: [Analytics]
      summary: Return date-filtered management summary
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: Aggregate counts and average rating } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AccountId: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/AccountId' } }
  responses:
    BadRequest: { description: Validation or state rejection }
  schemas:
    AccountId: { type: string, pattern: '^[A-Z]{1,2}[0-9]{3}$', example: P001 }
    RegisterRequest:
      type: object
      required: [fullName,email,password]
      properties: { fullName: { type: string }, email: { type: string, format: email }, password: { type: string, minLength: 8, maxLength: 72 }, phoneNumber: { type: string }, dateOfBirth: { type: string, format: date } }
    ProfileRequest:
      type: object
      required: [fullName,email]
      properties: { fullName: { type: string }, email: { type: string, format: email }, phoneNumber: { type: string }, dateOfBirth: { type: string, format: date }, address: { type: string, maxLength: 500 } }
    HoldRequest:
      type: object
      required: [slotId,patientId,serviceType,amount]
      properties: { slotId: { type: string, format: uuid }, patientId: { $ref: '#/components/schemas/AccountId' }, serviceType: { type: string }, amount: { type: number, format: decimal, minimum: 0 } }
    PaymentRequest:
      type: object
      required: [amount,method,status]
      properties:
        amount: { type: number, minimum: 0 }
        method: { type: string, enum: [CARD,CASH,BANK_TRANSFER,MOBILE_WALLET] }
        status: { type: string, enum: [PAID,PENDING,PARTIALLY_PAID,FAILED,REFUNDED] }
    CheckRequest:
      type: object
      required: [patientId]
      description: The practitioner ID is derived from the authenticated account and cannot be supplied by the client.
      properties: { patientId: { $ref: '#/components/schemas/AccountId' }, weightKg: { type: number }, bmi: { type: number }, systolic: { type: integer }, diastolic: { type: integer }, bloodSugar: { type: number }, temperature: { type: number }, notes: { type: string } }
    DietPlanRequest:
      type: object
      required: [patientId,title,calorieTarget,mealSchedule]
      description: The plan author ID is derived from the authenticated doctor or dietitian account.
      properties: { patientId: { $ref: '#/components/schemas/AccountId' }, title: { type: string }, calorieTarget: { type: integer }, exclusions: { type: string }, mealSchedule: { type: string } }
    ProgressRequest:
      type: object
      required: [patientId,date]
      properties: { patientId: { $ref: '#/components/schemas/AccountId' }, dietPlanId: { type: string, format: uuid }, date: { type: string, format: date }, weightKg: { type: number }, bmi: { type: number }, waterGlasses: { type: integer }, mealsCompleted: { type: integer } }
    MessageRequest:
      type: object
      required: [senderId,recipientId,patientId,body]
      properties: { senderId: { $ref: '#/components/schemas/AccountId' }, recipientId: { $ref: '#/components/schemas/AccountId' }, patientId: { $ref: '#/components/schemas/AccountId' }, body: { type: string, maxLength: 2000 } }
    NotificationRequest:
      type: object
      required: [recipientId,type,channel,message]
      properties: { recipientId: { $ref: '#/components/schemas/AccountId' }, type: { type: string }, channel: { type: string, enum: [IN_APP,EMAIL,SMS] }, message: { type: string }, simulateFailure: { type: boolean } }
    FeedbackRequest:
      type: object
      required: [patientId,practitionerId,appointmentId,rating]
      properties: { patientId: { $ref: '#/components/schemas/AccountId' }, practitionerId: { $ref: '#/components/schemas/AccountId' }, appointmentId: { type: string, format: uuid }, rating: { type: integer, minimum: 1, maximum: 5 }, comments: { type: string, maxLength: 1500 } }
    FeedbackUpdateRequest:
      type: object
      required: [rating]
      properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comments: { type: string, maxLength: 1500 } }
