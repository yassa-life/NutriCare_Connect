services:
  mysql:
    image: mysql:8.4
    container_name: nutricare-mysql
    environment:
      MYSQL_DATABASE: nutricare
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - nutricare_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  nutricare_mysql:
